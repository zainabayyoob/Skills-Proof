services:
  - type: web
    name: skills-proof-server
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AUTH_REQUIRE_EMAIL_VERIFICATION
        value: "false"
